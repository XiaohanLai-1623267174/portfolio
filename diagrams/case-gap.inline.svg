<defs><marker id="ah-case-gap" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 z" fill="var(--border-strong)"/></marker></defs>
<rect width="1200" height="800" fill="var(--canvas-warm)"/>
<text x="56" y="88" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="46" font-weight="700" fill="var(--ink)">同一条追问，改造前后</text>
<text x="56" y="136" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="500" fill="var(--ink-muted)">7 条人工追问样本，同一套装置前后各测一次；句式为例示</text>
