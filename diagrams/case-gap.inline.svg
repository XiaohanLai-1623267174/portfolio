<text x="676" y="232" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="700" fill="var(--accent)">改造后</text>
<rect x="88" y="256" width="456" height="96" rx="20" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="2.5"/>
