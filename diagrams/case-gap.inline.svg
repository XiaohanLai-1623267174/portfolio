<path d="M316 360 V404" stroke="var(--border-strong)" stroke-width="3.5" marker-end="url(#ah-case-gap)"/>
<rect x="676" y="256" width="456" height="96" rx="20" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="2.5"/>
<text x="904" y="316" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="34" font-weight="600" fill="var(--ink)" text-anchor="middle">「那第二条呢？」</text>
<path d="M904 360 V404" stroke="var(--border-strong)" stroke-width="3.5" marker-end="url(#ah-case-gap)"/>
<text x="88" y="444" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="500" fill="var(--ink)">① 当成一个全新问题</text>
<text x="88" y="492" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="500" fill="var(--ink)">② 检索到另一份文件</text>
<text x="88" y="540" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="500" fill="var(--ink)">③ 答非所问</text>
<text x="676" y="444" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="500" fill="var(--ink)">① 带上上一轮问答 + 工具结果</text>
<text x="676" y="492" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="500" fill="var(--ink)">② 改写成完整问句</text>
<text x="676" y="540" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="500" fill="var(--ink)">③ 命中同一份文件，答对</text>
<rect x="88" y="580" width="336" height="64" rx="32" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="2.5"/>
<text x="256" y="622" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="700" fill="var(--ink)" text-anchor="middle">7 条里误判 4 条</text>
<rect x="676" y="580" width="336" height="64" rx="32" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="2.5"/>
<text x="844" y="622" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="700" fill="var(--accent)" text-anchor="middle">7 条里误判 0 条</text>
<path d="M566 304 H634" stroke="var(--border-strong)" stroke-width="3.5" marker-end="url(#ah-case-gap)"/>
<text x="56" y="760" font-family="Segoe UI, PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="26" font-weight="500" fill="var(--ink-subtle)">误判样本只有 7 条，结论只覆盖这一组样本</text>
